version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mern-db
    ports:
      - "27017:27017"
    volumes:
      - dbdata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./server
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/mern-demo}
      - PORT=${PORT:-5000}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build: ./client
    container_name: mern-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:5000
    depends_on:
      - backend

volumes:
  dbdata:
