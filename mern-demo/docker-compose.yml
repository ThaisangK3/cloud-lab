version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mern-db
    ports:
      - "27017:27017"
    volumes:
      - dbdata:/data/db

  backend:
    build: ./server
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/mern-demo
      - PORT=5000
    depends_on:
      - mongodb

  frontend:
    build: ./client
    container_name: mern-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dbdata:
